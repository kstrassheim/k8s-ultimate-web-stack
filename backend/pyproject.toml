[tool.coverage.run]
source = ["."]
omit = [
    "*/mock/*",
    "*/venv/*",
    "setup.py",
    # Test files are excluded from the production coverage measurement. The
    # target is "every production module reports 100%", not "every line of
    # the test suite reports 100%". A missing test-file assertion is a test
    # quality problem, not a coverage gap.
    "*_test.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError"
]
fail_under = 69
show_missing = true