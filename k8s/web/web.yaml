apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app: web
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app: web
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
    app.kubernetes.io/managed-by: argocd
spec:
  # 1 replica: chat/experiments/worldline broadcasts use an in-memory per-pod
  # connection list, so multiple replicas can't see each other's WS clients.
  # Scaling >1 would need a pub/sub backplane (e.g. Redis).
  replicas: 1
  # Explicit RollingUpdate for a 1-replica Deployment (issue #107).
  #
  # The default maxUnavailable is 25%, which rounds UP to 1 here — Kubernetes
  # may take the only pod down before the replacement is ready, producing a
  # window of 502s on every deploy. Deploys are frequent because CI restarts
  # the rollout to pick up the mutable image tag (see .github/workflows/
  # _build-env.yml). /ready (added in #100) already gates Service traffic on
  # real readiness, so the missing piece is forcing the rollout to bring the
  # new pod up first.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # NOTE on the interaction with replicas: 1: maxSurge: 1 means two pods
  # coexist briefly during a rollout. WebSocket clients on the OLD pod are
  # disconnected at its termination rather than migrated — there is no
  # pub/sub backplane (see the replicas comment above). The client
  # reconnects on its next retry, which is the established behaviour for
  # this API. Recorded as an explicit decision so a future maintainer who
  # sees "two pods during a rollout" does not assume WS continuity by
  # accident.
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      # Out-of-band dockerconfigjson for the in-cluster registry (per namespace),
      # same pattern as the other cluster projects. Create with:
      #   kubectl create secret docker-registry registry-pull-secret \
      #     --docker-server=mainpi.local:5000 --docker-username=admin \
      #     --docker-password=<pw> -n <namespace>
      imagePullSecrets:
        - name: registry-pull-secret
      # runAsUser=1000 matches the `appuser` created by backend/Dockerfile
      # (`useradd -m -u 1000 appuser`). The web image has no PVC and no
      # pre-existing on-disk data, so no initContainer chown is needed —
      # unlike the MongoDB StatefulSet, which has to bridge old (root-owned)
      # /data/db content to the new non-root runner.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: web
          # FastAPI backend that also serves the React SPA from ./dist
          image: mainpi.local:5000/ultimate-web-stack/web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            # Closes issue #104: MONGODB_URI now carries credentials. The
            # full URI (including username + password) is stored in the
            # mongodb-credentials Secret under the `mongodb-uri` key so the
            # URI composition lives in one place (the Secret) instead of
            # being split between manifest + Secret. The Secret itself is
            # created out-of-band per namespace (same pattern as the
            # registry-pull-secret above); see k8s/mongodb/mongodb.yaml
            # for the create command and the key list. The env value below
            # is intentionally NOT a literal — applying this manifest
            # without first creating the Secret leaves MONGODB_URI unset,
            # which is the desired loud failure mode (vs a silent no-auth
            # connection).
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: mongodb-uri
            - name: MONGODB_DB
              value: future_gadget_lab
            - name: MOCK
              value: "false"
            - name: PYTHONPATH
              value: /app
            # PYTHONDONTWRITEBYTECODE=1 prevents Python from creating
            # __pycache__/ directories next to every imported module. Without
            # this, the readOnlyRootFilesystem=true constraint below would
            # cause EROFS on the first request that imports anything outside
            # the standard library. See PR #103 / issue #103.
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            # Pin TMPDIR=/tmp to keep Python's tempfile module, the OpenSSL
            # PRNG seed (used by python-jose for Entra JWT verification), and
            # uvicorn's reload state off the read-only rootfs. The emptyDir
            # mounted at /tmp below provides the actual writable space.
            - name: TMPDIR
              value: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Hardened per the CronJob precedent (k8s/mongodb/backup-cronjob.yaml).
          # The web image (python:3.12-slim based, USER=appuser=1000) tolerates
          # a read-only root filesystem once /tmp is writable — see PYTHONDONTWRITEBYTECODE
          # + TMPDIR env vars above, and the emptyDir mount on /tmp below.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # /health calls psutil.cpu_percent(interval=1), which blocks ~1s, so
          # the probe timeout must exceed that (default timeoutSeconds=1 fails).
          # Liveness = "is the process alive"; the pod restart path is here.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          # /ready hits MongoDB — the one external dependency the API
          # needs to serve real traffic. While the new pod 503s on /ready,
          # kube-proxy keeps it out of the Service endpoints, so a rolling
          # update never sends a request to a pod that would 500. Failing
          # this probe does NOT restart the pod (that's liveness's job).
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        # Memory-backed emptyDir for /tmp. Sized generously because
        # OpenTelemetry's BatchSpanProcessor buffers spans before OTLP export,
        # and python-jose caches PEM material for JWT verification on first
        # call. 64Mi is enough for both at the lab's traffic levels.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
