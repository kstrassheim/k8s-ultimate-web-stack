apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app: mongodb
    app.kubernetes.io/managed-by: argocd
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - port: 27017
      name: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  labels:
    app: mongodb
    app.kubernetes.io/managed-by: argocd
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      # runAsUser=999 matches the `mongodb` user created in the upstream
      # mongo:8.0 image Dockerfile (https://github.com/docker-library/mongo/blob/master/8.0/Dockerfile).
      # fsGroup=999 makes kubelet recursive-chgrp the data volume on pod
      # startup, but it does NOT chown USER — only GROUP — so files written
      # by the old (root-running) pod stay owned by root. The initContainer
      # below fixes that on every restart by running as root and chowning
      # /data/db to 999:999 before mongod starts.
      #
      # The StatefulSet runs replicas=1 and the existing PVC was populated
      # while no pod-level securityContext was set (i.e. the mongod process
      # ran as root). The initContainer's chown is the seam between "old
      # data on disk" and "new non-root runner".
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      initContainers:
        - name: fix-data-ownership
          # Same image as mongod — guarantees the `mongodb` user/group are
          # defined with the same UID/GID we're about to chown to.
          image: mongo:8.0
          imagePullPolicy: IfNotPresent
          # `find -L /data/db \! -user 999 -exec chown 999:999 {} +` mirrors
          # the chown that the upstream docker-entrypoint.sh does *only* when
          # mongod is started as root. Because this StatefulSet runs as
          # non-root (runAsUser=999), the entrypoint's auto-chown branch is
          # skipped, so we do it explicitly here. Skipping files already
          # owned by the target UID keeps the operation cheap on subsequent
          # restarts when there's nothing to fix.
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              find -L /data/db \! -user 999 -exec chown 999:999 {} +
              find -L /data/db \! -group 999 -exec chgrp 999 {} +
          # This init container must run as root to perform the chown. It
          # still drops privileges and the read-only rootfs constraint, just
          # to the bare minimum needed for a one-shot chown: a read-only root
          # filesystem is fine because find/chown don't write to /.
          #
          # `runAsNonRoot: false` explicitly overrides the pod-level
          # `runAsNonRoot: true`. The kubelet refuses to start any container
          # whose effective securityContext has both `runAsNonRoot: true`
          # and `runAsUser: 0`, so we have to relax the non-root flag for
          # this one container. The main `mongodb` container still runs as
          # 999 (verified by `kubectl get pod ... -o jsonpath='{.spec}'`).
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
      containers:
        - name: mongodb
          image: mongo:8.0
          # Closes issue #104: instead of running mongod directly, run the
          # two-phase entrypoint that bootstraps users (root / app / backup)
          # against a no-auth temporary mongod on 127.0.0.1, then `exec`s the
          # real mongod with --auth. See scripts/mongo-entrypoint.sh and
          # k8s/mongodb/mongodb-entrypoint-configmap.yaml.
          #
          # Credentials come from the mongodb-credentials Secret out-of-band
          # (same pattern as the registry-pull-secret referenced from the web
          # Deployment). Operator creates one per namespace:
          #
          #   ROOT_PW=$(openssl rand -hex 24)
          #   APP_PW=$(openssl rand -hex 24)
          #   BACKUP_PW=$(openssl rand -hex 24)
          #   kubectl create secret generic mongodb-credentials \
          #     --from-literal=MONGO_INITDB_ROOT_USERNAME=mongo-root \
          #     --from-literal=MONGO_INITDB_ROOT_PASSWORD="${ROOT_PW}" \
          #     --from-literal=APP_DB_USERNAME=mongo-app \
          #     --from-literal=APP_DB_PASSWORD="${APP_PW}" \
          #     --from-literal=BACKUP_DB_USERNAME=mongo-backup \
          #     --from-literal=BACKUP_DB_PASSWORD="${BACKUP_PW}" \
          #     --from-literal=mongodb-uri="mongodb://mongo-app:${APP_PW}@mongodb:27017/?authSource=admin" \
          #     --from-literal=mongo-uri="mongodb://mongo-backup:${BACKUP_PW}@mongodb:27017/?authSource=admin" \
          #     -n <namespace>
          #
          # NO credential is ever committed to git. The Secret data values
          # are referenced via secretKeyRef below; the URI strings are also
          # stored in the Secret so the web / backup pods just envFrom them
          # without needing shell composition in the manifest.
          command: ["/bin/bash", "/scripts/mongo-entrypoint.sh"]
          args:
            - --dbpath
            - /data/db
            - --bind_ip
            - 0.0.0.0
            - --auth
          ports:
            - containerPort: 27017
              name: mongodb
          env:
            # All six bootstrap vars come from the Secret. The entrypoint
            # script reads them as $MONGO_INITDB_ROOT_USERNAME etc. and
            # passes them to mongosh via process.env.* (never via argv, so
            # the password never appears in /proc/PID/cmdline).
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: APP_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: APP_DB_USERNAME
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: APP_DB_PASSWORD
            - name: BACKUP_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: BACKUP_DB_USERNAME
            - name: BACKUP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: BACKUP_DB_PASSWORD
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
            # /scripts/mongo-entrypoint.sh is the two-phase startup script
            # sourced from the mongo-entrypoint-script ConfigMap. defaultMode
            # 0o555 makes the file readable + executable for the mongodb
            # user (UID 999). Without `executable: true` on the mount the
            # ConfigMap projection would be 0o444 and bash would refuse to
            # run it.
            - name: entrypoint-script
              mountPath: /scripts
              readOnly: true
            # mongod's docker-entrypoint.sh uses `$TMPDIR` (default /tmp) for
            # the JSON config files it builds when --config is supplied. With
            # readOnlyRootFilesystem=true on the main container, that path
            # must be writable — same pattern as the mongo-backup CronJob.
            # The two-phase entrypoint ALSO writes /tmp/mongod-bootstrap.log
            # and /tmp/mongod-bootstrap.pid here while the temporary mongod
            # runs in the background during phase 1.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # Hardened per the CronJob precedent (k8s/mongodb/backup-cronjob.yaml).
          # The container image itself does not need /tmp or any other
          # in-container path to be writable beyond what `tmp` provides.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # TCP checks: `mongosh` startup exceeds the probe timeout on the
          # ARM node, so an exec ping flaps and kubelet kills mongod.
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        # Memory-backed emptyDir for /tmp. Sized small — mongod's
        # docker-entrypoint.sh writes a couple of kilobyte JSON files there
        # when --config is set; we don't pass --config, but the entrypoint
        # still allocates TMPDIR unconditionally. The two-phase startup also
        # writes /tmp/mongod-bootstrap.log + pidfile here while the temp
        # mongod runs in phase 1; those are a few KB each, well under 16Mi.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        # ConfigMap projection carrying scripts/mongo-entrypoint.sh. defaultMode
        # 0o555 makes the file executable for the mongodb user (UID 999).
        # Mounted read-only because the script never writes to it.
        - name: entrypoint-script
          configMap:
            name: mongo-entrypoint-script
            defaultMode: 0o555
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi