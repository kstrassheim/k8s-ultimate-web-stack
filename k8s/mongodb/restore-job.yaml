# ==============================
# MongoDB restore ConfigMap carrying scripts/mongo-restore.sh inline.
#
# Closes issue #105: the nightly backup CronJob (k8s/mongodb/backup-cronjob.yaml)
# writes archives to the `mongo-backup-data` PVC, but until now there was no
# counterpart that reads one back. This ConfigMap ships the restore script
# inline (mirroring the mongo-backup-script / mongo-entrypoint-script
# ConfigMap patterns) so a restore pod can mount it at /scripts without a
# git-mount or image rebuild.
#
# The Job that mounts this ConfigMap is NOT included here — it's a
# per-incident template (k8s/mongodb/restore-job-template.yaml) that the
# operator copies, fills in ARCHIVE / TARGET_DB / SOURCE_DB / FORCE, and
# applies by hand. See the README "Restoring from a backup" runbook.
#
# The script's canonical source is scripts/mongo-restore.sh; the body is
# mirrored below. The CI guard in .github/workflows/ci.yml::bash-restore-tests
# diffs the executable lines of this block against scripts/mongo-restore.sh
# on every PR and fails the build if they diverge, so the file in scripts/
# remains the only source of truth to edit.
# ==============================
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-restore-script
  labels:
    app: mongodb
    app.kubernetes.io/managed-by: argocd
data:
  mongo-restore.sh: |
    #!/usr/bin/env bash
    # Inline copy of scripts/mongo-restore.sh — keep these two in sync.
    # The bash-restore-tests CI job diffs the executable lines of this
    # block against scripts/mongo-restore.sh and fails the build on any
    # divergence, so the file in scripts/ remains the only source of
    # truth to edit.
    set -euo pipefail

    # Closes issue #104: MONGO_URI now arrives from the mongodb-credentials
    # Secret (key `mongo-uri`, mounted via env below) carrying the app
    # user's credentials. The ${MONGO_URI:-...} default is intentionally
    # left as the no-auth fallback for the smoke-test shim (scripts/
    # mongo-restore_test.sh), which never invokes a real mongod; the
    # restore Job's env injects the real value before the script runs.
    MONGO_URI="${MONGO_URI:-mongodb://mongodb:27017}"
    ARCHIVE="${ARCHIVE:-}"
    TARGET_DB="${TARGET_DB:-}"
    # SOURCE_DB defaults to TARGET_DB so a same-named source/target is
    # the easy case; the operator overrides via env when restoring an
    # archive into a differently-named DB (see the README runbook).
    SOURCE_DB="${SOURCE_DB:-${TARGET_DB}}"
    # FORCE=1 permits overwriting an existing non-empty target DB.
    # Without it, the script exits non-zero if the target already has
    # any collections — restoring is the one operation here that
    # destroys data, so the safe path is the default.
    FORCE="${FORCE:-0}"

    # Closes issue #104: MONGO_URI now carries credentials. Redact the
    # password segment before logging so `kubectl logs` / Loki /
    # Elasticsearch do not capture it on every run. The actual MONGO_URI
    # is unchanged — only the log-time string is masked; the no-auth
    # default URI has no match and passes through untouched.
    REDACTED_URI="$(printf '%s' "${MONGO_URI}" | sed -E 's|(://[^:]+:)[^@]+(@)|\1***\2|')"

    log()  { printf '[%s] %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$*" >&2; }
    fail() {
      log "RESTORE FAILED archive=${ARCHIVE} reason=${1}"
      exit 1
    }

    if [ -z "${ARCHIVE}" ]; then
      fail "ARCHIVE env var is required (path to the tar.gz to restore)"
    fi
    if [ -z "${TARGET_DB}" ]; then
      fail "TARGET_DB env var is required (database name to restore into)"
    fi

    log "RESTORE STARTING source=${REDACTED_URI} archive=${ARCHIVE} target_db=${TARGET_DB} source_db=${SOURCE_DB} force=${FORCE}"

    if [ ! -f "${ARCHIVE}" ]; then
      fail "archive does not exist"
    fi
    if [ ! -r "${ARCHIVE}" ]; then
      fail "archive is not readable"
    fi
    if [ ! -s "${ARCHIVE}" ]; then
      fail "archive is empty"
    fi
    if ! tar -tzf "${ARCHIVE}" >/dev/null 2>&1; then
      fail "archive is corrupt or unreadable"
    fi

    # Refuse to overwrite a non-empty target unless FORCE=1.
    coll_count="$(mongosh --uri="${MONGO_URI}" --quiet --eval \
      "print(db.getSiblingDB('${TARGET_DB}').getCollectionNames().length);" 2>/dev/null || true)"
    if [ -z "${coll_count}" ]; then
      fail "could not query target database '${TARGET_DB}' via mongosh (check MONGO_URI / connectivity)"
    fi
    if [ "${coll_count}" -gt 0 ] 2>/dev/null; then
      if [ "${FORCE}" != "1" ]; then
        fail "target database '${TARGET_DB}' already contains ${coll_count} collection(s); set FORCE=1 to overwrite"
      fi
      log "WARN: overwriting target database '${TARGET_DB}' with ${coll_count} existing collection(s) (FORCE=1)"
    fi

    # ERR/INT/TERM trap registered BEFORE the first potentially-failing
    # call (mktemp) so every error path funnels through fail() and emits
    # the archive-named error line required by issue #105's acceptance
    # criterion #2.
    tmp_dir=""
    on_error() {
      if [ -n "${tmp_dir}" ] && [ -d "${tmp_dir}" ]; then
        rm -rf "${tmp_dir}"
      fi
      fail "aborted by signal or error"
    }
    trap on_error ERR INT TERM

    tmp_dir="$(mktemp -d -t mongo-restore.XXXXXX)"
    trap on_error ERR INT TERM

    log "extracting archive to ${tmp_dir}"
    if ! tar -xzf "${ARCHIVE}" -C "${tmp_dir}"; then
      fail "tar extraction failed"
    fi

    src_dir=""
    for candidate in "${tmp_dir}/dump/${SOURCE_DB}" "${tmp_dir}/${SOURCE_DB}"; do
      if [ -d "${candidate}" ]; then
        src_dir="${candidate}"
        break
      fi
    done
    if [ -z "${src_dir}" ]; then
      fail "extracted archive does not contain expected directory dump/${SOURCE_DB}/ (or ${SOURCE_DB}/)"
    fi

    mongorestore_args=(--uri="${MONGO_URI}" --db="${TARGET_DB}")
    if [ "${FORCE}" = "1" ]; then
      mongorestore_args+=(--drop)
    fi
    mongorestore_args+=("${src_dir}")

    log "running mongorestore (source_dir=${src_dir} drop=${FORCE})"
    if ! mongorestore "${mongorestore_args[@]}"; then
      fail "mongorestore returned non-zero exit code"
    fi

    post_count="$(mongosh --uri="${MONGO_URI}" --quiet --eval \
      "print(db.getSiblingDB('${TARGET_DB}').getCollectionNames().length);" 2>/dev/null || echo "0")"
    if [ "${post_count}" -le 0 ] 2>/dev/null; then
      fail "post-restore: target database '${TARGET_DB}' has 0 collections (restore silently produced nothing)"
    fi

    rm -rf "${tmp_dir}"
    trap - ERR INT TERM
    log "RESTORE SUCCEEDED archive=${ARCHIVE} target_db=${TARGET_DB} collections=${post_count}"
    exit 0
