# ==============================
# PROD environment  (namespace: ultimate-web-stack, deploys from tags)
# Mutable image tag: CI rebuilds web:prod after the `prod` approval and restarts
# the deployment to pull it (see .github/workflows/_build-env.yml).
# ==============================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ultimate-web-stack

labels:
  - pairs:
      app.kubernetes.io/environment: prod
    includeSelectors: false

resources:
  - ../base
  # Per-namespace defaults + envelope (closes issue #109).
  - limit-range.yaml
  - resource-quota.yaml

images:
  - name: mainpi.local:5000/ultimate-web-stack/web
    newTag: prod

patches:
  - path: patch-web-env.yaml
    target:
      kind: Deployment
      name: web
  - path: patch-backup-env.yaml
    target:
      kind: CronJob
      name: mongo-backup
  # Per-env Ingress sub-path patch (closes issue #110).
  - path: patch-ingress.yaml
    target:
      kind: Ingress
      name: web