# ==============================
# PROD MongoDB-backup env patch
#
# prod uses the un-suffixed `future_gadget_lab` database (same as the web
# Deployment patch). Kept here so adding a new env is a copy of one of these
# three files plus one line in the overlay's kustomization.yaml.
# ==============================
- op: replace
  path: /spec/jobTemplate/spec/template/spec/containers/0/env
  value:
    # Closes issue #104: MONGO_URI comes from the mongodb-credentials
    # Secret (key `mongo-uri`). The Secret is per-namespace (same
    # out-of-band pattern as registry-pull-secret). See
    # k8s/mongodb/mongodb.yaml for the create command.
    - name: MONGO_URI
      valueFrom:
        secretKeyRef:
          name: mongodb-credentials
          key: mongo-uri
    - name: MONGO_DB
      value: future_gadget_lab
    - name: DEST_DIR
      value: /backup
    - name: RETENTION_DAYS
      value: "7"
