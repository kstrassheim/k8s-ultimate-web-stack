# ==============================
# TEST Backend env patch
# ==============================
- op: replace
  path: /spec/template/spec/containers/0/env
  value:
    # Closes issue #104: MONGODB_URI comes from the mongodb-credentials
    # Secret (key `mongodb-uri`). The Secret is per-namespace (same
    # out-of-band pattern as registry-pull-secret). See
    # k8s/mongodb/mongodb.yaml for the create command.
    - name: MONGODB_URI
      valueFrom:
        secretKeyRef:
          name: mongodb-credentials
          key: mongodb-uri
    - name: MONGODB_DB
      value: future_gadget_lab_test
    - name: MOCK
      value: "false"
    - name: PYTHONPATH
      value: /app
    - name: TF_ENV
      value: test
    # Carry-over from base k8s/web/web.yaml — needed because this patch
    # replaces the env block wholesale. PYTHONDONTWRITEBYTECODE keeps Python
    # from creating __pycache__/ on the read-only rootfs, TMPDIR pins
    # tempfile / OpenSSL PRNG state to /tmp (the emptyDir mounted writable).
    # See PR #103 / issue #103.
    - name: PYTHONDONTWRITEBYTECODE
      value: "1"
    - name: TMPDIR
      value: /tmp