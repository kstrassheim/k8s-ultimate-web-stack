# ==============================
# DEV MongoDB-backup env patch
#
# The base CronJob targets MONGO_DB=future_gadget_lab (the prod DB). In dev
# the database is `future_gadget_lab_dev`, so we replace the env block.
# Matches the per-env patch the web Deployment uses (patch-web-env.yaml).
# ==============================
- op: replace
  path: /spec/jobTemplate/spec/template/spec/containers/0/env
  value:
    # Closes issue #104: MONGO_URI comes from the mongodb-credentials
    # Secret (key `mongo-uri`). The Secret is per-namespace (same
    # out-of-band pattern as registry-pull-secret). See
    # k8s/mongodb/mongodb.yaml for the create command.
    - name: MONGO_URI
      valueFrom:
        secretKeyRef:
          name: mongodb-credentials
          key: mongo-uri
    - name: MONGO_DB
      value: future_gadget_lab_dev
    - name: DEST_DIR
      value: /backup
    - name: RETENTION_DAYS
      value: "7"
