# ==============================
# DEV environment  (namespace: ultimate-web-stack-dev, deploys from main)
# ==============================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ultimate-web-stack-dev

labels:
  - pairs:
      app.kubernetes.io/environment: dev
    includeSelectors: false

resources:
  - ../base
  - ingress.yaml

images:
  - name: mainpi.local:5000/ultimate-web-stack/web
    newTag: dev

patches:
  - path: patch-web-env.yaml
    target:
      kind: Deployment
      name: web
  - path: patch-backup-env.yaml
    target:
      kind: CronJob
      name: mongo-backup
  # SCRATCH: this patch file does not exist. It is here to demonstrate
  # that the new kustomize-validate CI job (PR #122 / issue #111) catches
  # a broken overlay. Will be removed in the next commit.
  - path: patch-does-not-exist.yaml
    target:
      kind: ConfigMap
      name: nothing
