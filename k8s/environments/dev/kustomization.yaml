# ==============================
# DEV environment  (namespace: ultimate-web-stack-dev, deploys from main)
# ==============================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ultimate-web-stack-dev

labels:
  - pairs:
      app.kubernetes.io/environment: dev
    includeSelectors: false

resources:
  - ../base
  - ingress.yaml
  # Per-namespace defaults + envelope (closes issue #109). Both files set the
  # `namespace:` above; LimitRange applies per-container defaults and a max,
  # ResourceQuota caps the total the namespace can consume.
  - limit-range.yaml
  - resource-quota.yaml
  # DEV ONLY. Read-only visibility for the claw-code-local bot so it can
  # diagnose a broken environment rather than guess from the repo. Scoped to
  # dev deliberately: this is where the bot's tester points, and where a
  # broken deploy is expected rather than an incident. Widening it to test or
  # prod is a separate decision, and the file lives here rather than in
  # ../../rbac because kustomize refuses to load a FILE from above its root.
  - claw-bot-read-rbac.yaml

images:
  - name: mainpi.local:5000/ultimate-web-stack/web
    newTag: dev

patches:
  - path: patch-web-env.yaml
    target:
      kind: Deployment
      name: web
  - path: patch-backup-env.yaml
    target:
      kind: CronJob
      name: mongo-backup
