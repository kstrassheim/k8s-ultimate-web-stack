name: _build-env

# Reusable per-environment pipeline: Terraform apply (App Reg) on a GitHub-hosted
# runner, then build+push the web image on the in-cluster runner. Called once per
# environment by build-images.yml. Binding a GitHub Environment lets a required
# reviewer on `prod` gate that environment's whole pipeline with one approval.

on:
  workflow_call:
    inputs:
      tf_env:
        description: Terraform / app-reg environment (dev|test|prod)
        type: string
        required: true
      gh_environment:
        description: GitHub Environment to bind (federated AZURE_CLIENT_ID + approval gate)
        type: string
        required: true
      image_tags:
        description: Space-separated full image refs to build and push
        type: string
        required: true
      rollout_namespace:
        description: Namespace whose deploy/web to roll after push (mutable image tag)
        type: string
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  tofu-config:
    name: OpenTofu apply + config
    runs-on: ubuntu-latest
    environment: ${{ inputs.gh_environment }}
    env:
      TF_ENV: ${{ inputs.tf_env }}
      # TF_VAR_env is what selects the state blob now: backend.key is
      # "app-reg-${var.env}.tfstate", resolved at `tofu init`. Without it every
      # environment would init against app-reg-dev.tfstate.
      TF_VAR_env: ${{ inputs.tf_env }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # The azure_vault key provider does NOT read ARM_* -- it only takes these
      # as block arguments, fed here by TF_VAR_*. ARM_USE_OIDC above stays for
      # the backend and the azurerm provider. Set one without the other and
      # that consumer falls back to AzureCLICredential, which fails with
      # "Please specify only one of subscription and tenant, not both".
      TF_VAR_use_oidc: "true"
      TF_VAR_arm_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_arm_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
    concurrency:
      group: tofu-app-reg-${{ inputs.tf_env }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6

      - name: OpenTofu apply + export config
        working-directory: terraform
        run: |
          set -euo pipefail
          tofu init
          tofu apply -auto-approve -no-color
          tofu output -json > terraform.config.json

      - name: Upload config artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-tofu-config-${{ inputs.tf_env }}
          path: terraform/terraform.config.json
          retention-days: 1

  build-push:
    name: Build & push web image
    needs: tofu-config
    runs-on: arc-runner-scale-k8s-ultimate-web-stack
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch terraform config
        uses: actions/download-artifact@v8
        with:
          name: web-tofu-config-${{ inputs.tf_env }}
          path: _tfconfig

      - name: Place config for build (frontend build + backend runtime)
        run: |
          set -euo pipefail
          cp _tfconfig/terraform.config.json frontend/terraform.config.json
          cp _tfconfig/terraform.config.json backend/terraform.config.json

      - name: Log in to registry
        run: |
          echo "$REGISTRY_PASSWORD" | docker login mainpi.local:5000 \
            --username "$REGISTRY_USERNAME" --password-stdin

      - name: Build & push image
        run: |
          set -euo pipefail
          tag_args=""
          for t in ${{ inputs.image_tags }}; do tag_args="${tag_args} -t ${t}"; done
          docker build ${tag_args} -f backend/Dockerfile .
          for t in ${{ inputs.image_tags }}; do docker push "${t}"; done

      # Image tags are mutable (web:dev/test/prod), so the manifest doesn't
      # change and ArgoCD won't roll on its own — restart the deployment to pull
      # the freshly-pushed image. This runs on the in-cluster runner using its
      # ServiceAccount; RBAC to restart deploy/web is granted per namespace in
      # k8s/base/runner-rollout-rbac.yaml. The apps ignore the restartedAt
      # annotation so this doesn't fight selfHeal.
      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
      - name: Roll out new image
        run: |
          set -euo pipefail
          ns="${{ inputs.rollout_namespace }}"
          kubectl rollout restart deployment/web -n "$ns"
          kubectl rollout status  deployment/web -n "$ns" --timeout=300s
