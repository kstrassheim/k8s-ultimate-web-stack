name: CI / Tests

# Tests run on PRs (before merge). They do not re-run on push to main — the PR
# already validated it, and merging to main triggers the deploy, not tests.
on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - main
      - prod

jobs:
  codeql-analysis:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python, javascript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python,javascript"

  backend-unit-tests:
    runs-on: ubuntu-latest
    container: python:3.12-alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build tools + python3
        run: |
          apk add --no-cache gcc musl-dev linux-headers python3 py3-pip

      - name: Install backend dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          # Copy mock terraform config for MOCK=true test runs
          cp -n mock/terraform.mock.config.json terraform.config.json 2>/dev/null || true

      - name: Run pytest with coverage
        run: |
          cd backend
          pytest --cov=. --cov-report=xml --cov-report=html

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-coverage
          path: backend/htmlcov
          if-no-files-found: ignore

  frontend-unit-tests:
    runs-on: ubuntu-latest
    container: node:24-alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: apk add --no-cache python3 make g++ git bash

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm config set fetch-retries 5
          npm config set fetch-retry-maxtimeout 60000
          npm ci || npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Jest tests
        run: |
          cd frontend
          npm run test:coverage

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jest-coverage
          path: frontend/coverage/lcov-report
          if-no-files-found: ignore

  bash-backup-tests:
    # Smoke tests + drift guard for scripts/mongo-backup.sh.
    #
    # Closes the loop on issue #90's acceptance criteria by exercising every
    # error path the script claims to handle (volume full, mongodump fail,
    # empty dump, tar ENOSPC, read-only destination, EROFS on /tmp) AND by
    # failing the build if the inline ConfigMap body in the CronJob manifest
    # drifts from the canonical scripts/mongo-backup.sh. This is the CI guard
    # for review finding #3 (wiring smoke tests in) and finding #4 (preventing
    # silent drift between the two copies of the script) on PR #99.
    name: Bash Backup Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bash syntax check on the script
        # `bash -n` parses without executing — catches unbalanced quotes /
        # heredocs before any test scenario runs.
        run: bash -n scripts/mongo-backup.sh

      - name: Run backup script smoke tests
        run: bash scripts/mongo-backup_test.sh

      - name: Verify inline ConfigMap body matches scripts/mongo-backup.sh
        # Extract the indented block under `data.mongo-backup.sh: |` from
        # the CronJob manifest, strip comments + blank lines, and diff
        # against the same view of scripts/mongo-backup.sh. Exits 0 on
        # match, 1 on any divergence (which fails the CI run).
        run: |
          set -euo pipefail
          awk '
            /^  mongo-backup.sh: \|/ { in_data = 1; next }
            in_data && /^[^ ]/      { in_data = 0 }
            in_data                  { sub(/^    /, ""); print }
          ' k8s/mongodb/backup-cronjob.yaml \
            | grep -v '^[[:space:]]*#' | grep -v '^[[:space:]]*$' \
            > /tmp/inline_exec.sh
          grep -v '^[[:space:]]*#' scripts/mongo-backup.sh \
            | grep -v '^[[:space:]]*$' \
            > /tmp/file_exec.sh
          if ! diff -u /tmp/file_exec.sh /tmp/inline_exec.sh; then
            echo "::error::The inline ConfigMap body in k8s/mongodb/backup-cronjob.yaml has drifted from scripts/mongo-backup.sh. Update the inline copy (or vice-versa) and re-run CI." >&2
            exit 1
          fi
          echo "OK: inline ConfigMap body matches scripts/mongo-backup.sh"

  bash-restore-tests:
    # Smoke tests + drift guard for scripts/mongo-restore.sh.
    #
    # Closes the loop on issue #105's acceptance criteria by exercising
    # every error path the script claims to handle (missing archive,
    # empty/corrupt archive, missing env vars, target DB non-empty + no
    # FORCE refusal, target DB non-empty + FORCE=1 overwrite, mongosh
    # pre-flight failure, mongorestore failure, cross-database restore,
    # legacy archive layout, archive without expected source_db, EROFS
    # on /tmp, credentialed MONGO_URI redaction) AND by exercising the
    # full round-trip (seed → mongo-backup.sh → mongo-restore.sh →
    # verify seed file survived the trip). The drift guard diffs the
    # inline ConfigMap body in k8s/mongodb/restore-job.yaml against
    # scripts/mongo-restore.sh, so there is one source of truth
    # (scripts/, exercised by the smoke tests) and zero risk of the
    # inline copy silently drifting — same pattern as bash-backup-tests
    # and bash-entrypoint-tests.
    name: Bash Restore Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bash syntax check on the script
        # `bash -n` parses without executing — catches unbalanced quotes /
        # heredocs before any test scenario runs.
        run: bash -n scripts/mongo-restore.sh

      - name: Run restore script smoke tests
        run: bash scripts/mongo-restore_test.sh

      - name: Verify inline ConfigMap body matches scripts/mongo-restore.sh
        # Extract the indented block under `data.mongo-restore.sh: |` from
        # the ConfigMap manifest, strip comments + blank lines, and diff
        # against the same view of scripts/mongo-restore.sh. Exits 0 on
        # match, 1 on any divergence (which fails the CI run).
        run: |
          set -euo pipefail
          awk '
            /^  mongo-restore.sh: \|/ { in_data = 1; next }
            in_data && /^[^ ]/         { in_data = 0 }
            in_data                     { sub(/^    /, ""); print }
          ' k8s/mongodb/restore-job.yaml \
            | grep -v '^[[:space:]]*#' | grep -v '^[[:space:]]*$' \
            > /tmp/inline_restore.sh
          grep -v '^[[:space:]]*#' scripts/mongo-restore.sh \
            | grep -v '^[[:space:]]*$' \
            > /tmp/file_restore.sh
          if ! diff -u /tmp/file_restore.sh /tmp/inline_restore.sh; then
            echo "::error::The inline ConfigMap body in k8s/mongodb/restore-job.yaml has drifted from scripts/mongo-restore.sh. Update the inline copy (or vice-versa) and re-run CI." >&2
            exit 1
          fi
          echo "OK: inline ConfigMap body matches scripts/mongo-restore.sh"

  bash-entrypoint-tests:
    # Smoke tests + drift guard for scripts/mongo-entrypoint.sh.
    #
    # Mirrors bash-backup-tests for the two-phase mongod entrypoint that
    # closes issue #104. The script under test wraps mongod so the
    # container bootstraps root/app/backup users against a no-auth temp
    # mongod, then `exec`s the real mongod with --auth. The smoke tests
    # use shimmed mongod/mongosh binaries to verify the entrypoint's
    # branching (happy path, mongod never ready, provision failure,
    # pass-through when no MONGO_INITDB_ROOT_USERNAME is set, --shutdown
    # failure falling back to SIGTERM, idempotency on restart).
    #
    # The drift guard diffs the inline ConfigMap body in
    # k8s/mongodb/mongodb-entrypoint-configmap.yaml against
    # scripts/mongo-entrypoint.sh, so there is one source of truth
    # (scripts/, exercised by the smoke tests) and zero risk of the
    # inline copy silently drifting — same pattern as bash-backup-tests.
    name: Bash Entrypoint Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bash syntax check on the script
        run: bash -n scripts/mongo-entrypoint.sh

      - name: Run entrypoint script smoke tests
        run: bash scripts/mongo-entrypoint_test.sh

      - name: Verify inline ConfigMap body matches scripts/mongo-entrypoint.sh
        run: |
          set -euo pipefail
          awk '
            /^  mongo-entrypoint.sh: \|/ { in_data = 1; next }
            in_data && /^[^ ]/           { in_data = 0 }
            in_data                       { sub(/^    /, ""); print }
          ' k8s/mongodb/mongodb-entrypoint-configmap.yaml \
            | grep -v '^[[:space:]]*#' | grep -v '^[[:space:]]*$' \
            > /tmp/inline_entrypoint.sh
          grep -v '^[[:space:]]*#' scripts/mongo-entrypoint.sh \
            | grep -v '^[[:space:]]*$' \
            > /tmp/file_entrypoint.sh
          if ! diff -u /tmp/file_entrypoint.sh /tmp/inline_entrypoint.sh; then
            echo "::error::The inline ConfigMap body in k8s/mongodb/mongodb-entrypoint-configmap.yaml has drifted from scripts/mongo-entrypoint.sh. Update the inline copy (or vice-versa) and re-run CI." >&2
            exit 1
          fi
          echo "OK: inline ConfigMap body matches scripts/mongo-entrypoint.sh"

  kustomize-validate:
    # Build every kustomize overlay under k8s/environments/ and validate the
    # rendered resources against real Kubernetes OpenAPI schemas.
    #
    # Closes issue #111's acceptance criteria:
    #   1. `kustomize build` runs on all three overlays and fails on any
    #      kustomize-level error (bad YAML, missing patch target, deleted
    #      resource that an overlay still references, …).
    #   2. The rendered output is fed to `kubeconform` for schema validation
    #      against a specific Kubernetes minor version, so ArgoCD cannot
    #      reject the same manifest for "unknown field" / "missing required
    #      field" reasons that CI did not catch.
    #   3. Runs on PRs alongside the rest of the CI matrix (no `if:` gate).
    #
    # Pinned to Kubernetes 1.30 by default — the lowest minor that still
    # ships every API used by these manifests (networking.k8s.io/v1 Ingress,
    # networking.k8s.io/v1 NetworkPolicy, apps/v1 Deployment/StatefulSet,
    # batch/v1 CronJob, rbac.authorization.k8s.io/v1, core/v1). Bump
    # KUBERNETES_VERSION below when the mainpi k3s cluster upgrades; the
    # rest of the job does not need to change. Validation runs in `-strict`
    # mode so unknown fields fail the build rather than being silently
    # ignored, and `-ignore-missing-schemas` is NOT set — the manifests in
    # this repo all map to standard K8s resources (no CRDs), so any "schema
    # not found" error is itself a signal that something genuinely off-spec
    # snuck in.
    name: Kustomize + Schema Validation
    runs-on: ubuntu-latest
    env:
      KUSTOMIZE_VERSION: v5.7.0
      KUBECONFORM_VERSION: v0.6.7
      # MUST match the mainpi k3s cluster's Kubernetes minor version. See
      # the job header for why and when to bump.
      KUBERNETES_VERSION: "1.30.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install kustomize
        # Standalone binary, not `kubectl kustomize` — the standalone kustomize
        # version is independent of whatever kubectl version GitHub Actions
        # happens to ship on the runner image, and we want the kustomize CLI
        # behaviour to be reproducible across runs.
        run: |
          set -euo pipefail
          curl -sSLo /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          sudo tar -C /usr/local/bin -xzf /tmp/kustomize.tar.gz kustomize
          rm -f /tmp/kustomize.tar.gz
          kustomize version

      - name: Install kubeconform
        # Bundled OpenAPI schemas are used (-schema-location default); no
        # CRDs in this repo, so no need to wire up datreeio/CRDs-catalog.
        run: |
          set -euo pipefail
          curl -sSLo /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          sudo tar -C /usr/local/bin -xzf /tmp/kubeconform.tar.gz kubeconform
          rm -f /tmp/kubeconform.tar.gz
          kubeconform -v

      - name: Build and validate all overlays
        run: |
          set -euo pipefail
          failures=0
          for env in dev test prod; do
            echo "::group::kustomize build k8s/environments/${env}"
            # kustomize build exits non-zero on: invalid YAML, missing
            # resource files, patch path that doesn't resolve, target kind/name
            # that no longer matches any resource, etc. Exactly the failure
            # modes the issue is asking CI to catch.
            kustomize build "k8s/environments/${env}" > "/tmp/${env}.yaml"
            resource_count="$(grep -c '^kind:' "/tmp/${env}.yaml")"
            echo "Built ${resource_count} resources for ${env}"
            echo "::endgroup::"

            echo "::group::kubeconform /tmp/${env}.yaml (Kubernetes ${KUBERNETES_VERSION})"
            # `-strict` rejects unknown fields; `-summary` ends with a one-line
            # pass/fail tally. `set +e` is intentional — we want to keep
            # running through all three overlays so a single failure shows up
            # alongside the others, then aggregate at the end.
            set +e
            kubeconform \
              -strict \
              -summary \
              -verbose \
              -kubernetes-version "${KUBERNETES_VERSION}" \
              -schema-location default \
              "/tmp/${env}.yaml"
            rc=$?
            set -e
            if [ "${rc}" -ne 0 ]; then
              echo "::error::kubeconform rejected /tmp/${env}.yaml (env=${env}, exit=${rc})"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done

          if [ "${failures}" -gt 0 ]; then
            echo "::error::${failures} overlay(s) failed kustomize + schema validation"
            exit 1
          fi
          echo "OK: kustomize build + kubeconform schema check passed for all 3 overlays (dev / test / prod)"

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        working-directory: terraform
        env:
          ARM_CLIENT_ID: dummy
          ARM_TENANT_ID: dummy
          ARM_SUBSCRIPTION_ID: dummy
        run: |
          # Use a dummy backend for validate-only (no state writes)
          terraform init -backend=false -input=false
        continue-on-error: false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          # Copy mock terraform config for MOCK=true test runs
          cp -n mock/terraform.mock.config.json terraform.config.json 2>/dev/null || true
          # Use MOCK mode so no real MongoDB is needed
          echo "MOCK=true" >> $GITHUB_ENV

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm config set fetch-retries 5
          npm ci || npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk2.0-0 libgtk-3-0 libgbm-dev libnotify-dev libnss3 \
            libxss1 libasound2-dev libxtst6 xauth xvfb fonts-liberation \
            libappindicator3-1 libatk-bridge2.0-0 libatk1.0-0 libcups2 \
            libdbus-1-3 libnspr4 libu2f-udev libvulkan1

      - name: Start backend (mock mode, no debug)
        run: |
          cd backend
          source venv/bin/activate
          # Start backend in mock mode without debugpy (faster startup for CI)
          # start-backend.js is at the repo root, not inside backend/, so use ../start-backend.js
          MOCK=true ENABLE_DEBUG=false node ../start-backend.js &
          BACKEND_PID=$!
          echo "Backend PID: $BACKEND_PID"
          # Wait for backend to be healthy
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend is healthy"
              break
            fi
            echo "Waiting for backend to start... ($i/30)"
            sleep 2
          done
          # Persist PID for later cleanup
          echo "BACKEND_PID=$BACKEND_PID" >> $GITHUB_ENV

      - name: Start frontend (mock mode)
        run: |
          cd frontend
          # Start frontend in mock mode - serves at port 5173
          # npm_config_mock=true is already set in the job env
          npm run test:frontend &
          FRONTEND_PID=$!
          echo "Frontend PID: $FRONTEND_PID"
          # Wait for frontend to be healthy
          for i in {1..30}; do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "Frontend is healthy"
              break
            fi
            echo "Waiting for frontend to start... ($i/30)"
            sleep 2
          done
          echo "FRONTEND_PID=$FRONTEND_PID" >> $GITHUB_ENV

      - name: "Flake guard: run experiments.cy.js 20 times (issue #95)"
        env:
          npm_config_mock: 'true'
        run: |
          cd frontend
          # Acceptance criterion #2 for issue #95: "The test passes twenty
          # consecutive runs." Loop experiments.cy.js twenty times against
          # the running mock backend + frontend; failure of any single run
          # fails this job.
          #
          # This is NOT Cypress retries — cypress.config.js has no `retries`
          # field, so each invocation is a fresh run, and no test is
          # skipped or marked pending. It is a pure verification loop for
          # the chained-assertion fix in PR #102.
          for i in $(seq 1 20); do
            echo "::group::experiments run $i/20"
            if ! npx cypress run --browser chrome --spec cypress/e2e/experiments.cy.js; then
              echo "::error::experiments.cy.js failed on run $i/20"
              exit 1
            fi
            echo "::endgroup::"
          done
          echo "OK: all 20 runs of experiments.cy.js passed"

      - name: Run E2E Tests (Cypress directly, no server spawning)
        env:
          npm_config_mock: 'true'
        run: |
          cd frontend
          # Clear any coverage data the flake-guard loop above may have
          # left behind so the report below reflects only this single
          # full-suite run.
          rm -rf .nyc_output/*
          # Run Cypress directly - backend is already running in the background
          # Do NOT use test:e2e:coverage (it spawns its own backend causing EADDRINUSE)
          npx cypress run --browser chrome --env coverage=true
          mkdir -p .nyc_output
          if [ "$(find .nyc_output -name '*.json' | wc -l)" -eq 0 ]; then
            echo '{}' > .nyc_output/coverage-placeholder.json
          fi
          npm run coverage:report:no-check

      - name: Stop frontend
        if: always()
        run: |
          if [ -n "$FRONTEND_PID" ]; then
            kill $FRONTEND_PID 2>/dev/null || true
          fi

      - name: Stop backend
        if: always()
        run: |
          if [ -n "$BACKEND_PID" ]; then
            kill $BACKEND_PID 2>/dev/null || true
          fi

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore

      - name: Upload test videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-videos
          path: frontend/cypress/videos
          if-no-files-found: ignore

      - name: Upload E2E coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-coverage-report
          path: frontend/coverage/lcov-report
          if-no-files-found: warn