name: OpenTofu

# Plan runs on every PR to main/prod (apply lives in build-images.yml, on merge).
on:
  pull_request:
    branches:
      - main
      - prod
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Apply now runs in build-images.yml (the deploy pipeline); this workflow only
# plans on PRs. Per-env concurrency (job level) keeps plan off an in-flight apply.

jobs:
  tofu-plan:
    name: OpenTofu Plan
    runs-on: ubuntu-latest
    # PR base picks the env: PR -> prod plans test, otherwise dev.
    environment: ${{ github.base_ref == 'prod' && 'test' || 'dev' }}
    env:
      TF_ENV: ${{ github.base_ref == 'prod' && 'test' || 'dev' }}
      # TF_VAR_env is what selects the state blob now: backend.key is
      # "app-reg-${var.env}.tfstate", resolved at `tofu init`. Without it every
      # environment would init against app-reg-dev.tfstate.
      TF_VAR_env: ${{ github.base_ref == 'prod' && 'test' || 'dev' }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # The azure_vault key provider does NOT read ARM_* -- it only takes these
      # as block arguments, fed here by TF_VAR_*. ARM_USE_OIDC above stays for
      # the backend and the azurerm provider. Set one without the other and
      # that consumer falls back to AzureCLICredential, which fails with
      # "Please specify only one of subscription and tenant, not both".
      TF_VAR_use_oidc: "true"
      TF_VAR_arm_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_arm_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
    concurrency:
      group: tofu-app-reg-${{ github.base_ref == 'prod' && 'test' || 'dev' }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    # Only run plan on PRs (for CI check) and manual dispatch — not on push to main/prod
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6

      - name: Azure Login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: OpenTofu Init
        working-directory: terraform
        run: tofu init

      - name: OpenTofu Plan
        working-directory: terraform
        run: tofu plan -no-color -out=tfplan > tfplan_output.txt 2>&1 || true; tofu show -no-color tfplan >> tfplan_output.txt 2>&1 || true
        id: tfplan

      - name: Upload OpenTofu Plan Artifact
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 7

      - name: Post OpenTofu Plan as PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let planText = '(plan output not available)';
            try {
              const path = '${{ github.workspace }}/terraform/tfplan_output.txt';
              if (fs.existsSync(path)) {
                planText = fs.readFileSync(path, 'utf8').substring(0, 65536);
              }
            } catch (e) { /* ignore */ }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '## Terraform Plan\n\n```\n' + planText + '\n```'
            });
